resina:
  message: "Profil DEV actif - vous etes en local"
  access-token: "dev-token"
  rate-limit-capacity: 1000
  netxms:
    base-url: "http://localhost:8080/mock-netxms"
    bearer-token: "dev-token"
  # Compte super-admin cree automatiquement au premier demarrage
  # (DataInitializer) si aucun compte de ce login n'existe deja.
  bootstrap:
    admin-login: ${RESINA_BOOTSTRAP_ADMIN_LOGIN:admin.dest}
    admin-password: ${RESINA_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    admin-nom-complet: ${RESINA_BOOTSTRAP_ADMIN_NOM:Administrateur ANPTIC}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/geoportail_resina_db
    username: postgres
    password: admin@
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: geoportail_resina
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Africa/Ouagadougou